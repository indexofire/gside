name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with pyright
        run: |
          pyright src/gside/

      - name: Test with pytest (coverage)
        run: |
          pytest -q --cov=src/gside --cov-report=term-missing --cov-fail-under=95

  pixi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: prefix-dev/setup-pixi@v0.9.5

    - name: Install pixi environments
      run: pixi install --all

    - name: Lint and format check
      run: pixi run -e dev check

    - name: Type check
      run: pixi run -e dev typecheck

    - name: Run tests
      run: pixi run -e dev pytest tests/ -q --cov=src/gside --cov-report=term-missing
