site_name: gside
site_description: Genome Species IDentification Engine — multi-layer pathogen species identification CLI
site_author: indexofire
site_url: https://indexofire.github.io/gside/

repo_name: indexofire/gside
repo_url: https://github.com/indexofire/gside

exclude_docs: |
  README.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # mkdocs-static-i18n configures Material's header language selector
      # (extra.alternate) and the per-language search stemmer automatically.
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Installation: 安装
            Quick Start: 快速开始
            Databases: 数据库
            Marker Database: Marker 数据库
            Usage: 使用
            Python API: Python API
            CLI Reference: CLI 参考
            Custom Databases: 自定义数据库
            Identification Modes: 鉴定模式
            Metagenomic Profiling: 宏基因组分析
            Architecture: 架构
            Layered Design: 分层设计
            Reference: 参考
            Marker Rules Format: Marker 规则格式
            JSON Output Contract: JSON 输出契约
            Development: 开发
            gseek Migration: gseek 迁移

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation:
    - Quick Start: installation/quick-start.md
    - Databases: installation/databases.md
    - Marker Database: installation/marker-database.md
  - Usage:
    - Python API: usage/python-api.md
    - CLI Reference: usage/cli.md
    - Custom Databases: usage/custom-databases.md
    - Identification Modes: usage/modes.md
    - Metagenomic Profiling: usage/meta.md
  - Architecture:
    - Layered Design: architecture/layers.md
  - Reference:
    - Marker Rules Format: reference/marker-rules.md
    - JSON Output Contract: reference/json-contract.md
  - Development:
    - gseek Migration: development/gseek-migration.md
