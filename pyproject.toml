[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gside"
version = "0.2.0"
description = "Genome Species Identification Engine — Python library and CLI for multi-layer species identification and metagenomic profiling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
license = "MIT"
dependencies = [
    "click>=8.0",
    "gseek>=0.10.2",
    "pydantic>=2",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.scripts]
gside = "gside.cli:main"
gside-mcp = "gside.mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pyright>=1.1", "mkdocs>=1.6", "mkdocs-material>=9.0", "mkdocs-static-i18n>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/gside"]

[tool.hatch.build.targets.wheel.force-include]
"data/db/D1_marker" = "src/gside/data/db/D1_marker"

[tool.hatch.build.targets.sdist.force-include]
"data/db/D1_marker" = "data/db/D1_marker"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["gside"]

[tool.coverage.report]
fail_under = 95
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
