[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gside"
version = "0.1.0"
description = "Genome Species IDentification Engine — multi-layer species identification CLI (marker genes / ANI / sketch / consensus)"
requires-python = ">=3.12,<3.13"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
license = "MIT"
dependencies = [
    "biopython>=1.83",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
gside = "gside.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pyright>=1.1", "mkdocs>=1.6", "mkdocs-material>=9.0", "mkdocs-static-i18n>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/gside"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["gside"]

[tool.coverage.report]
fail_under = 96
skip_covered = true

[tool.pyright]
# Quarantined: broken import, see AGENTS.md rule 9 + gotchas.
# Exclusion lifts when it is fixed or removed — not a lint waiver.
exclude = [
    "src/gside/engine/backends/kma.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
