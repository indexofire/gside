[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gside"
version = "0.1.0"
description = "Genome Species IDentification Engine — multi-layer species identification CLI (marker genes / ANI / sketch / consensus)"
requires-python = ">=3.11"
authors = [{ name = "indexofire", email = "indexofire@gmail.com" }]
license = "MIT"
dependencies = [
    "biopython>=1.83",
    "pyyaml>=6.0",
]

[project.scripts]
gside = "gside.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/gside"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
