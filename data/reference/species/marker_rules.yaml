- species: DEC
  genes:
  - uida
  - lacy
  - gada
  min_hits: 2
  min_identity: 95
  note: uidA+lacY or gadA+lacY at ≥95% → E. coli. ipaH may also be present (EIEC)
    - see Shigella_EIEC.
- species: Shigella_EIEC
  genes:
  - ipah
  min_hits: 1
  min_identity: 95
  note: ipaH ≥95% alone → Shigella/EIEC. If uidA+lacY also ≥95%, report as DEC with
    EIEC marker.
  co_detect_note: When both DEC and Shigella_EIEC markers are positive, prefer DEC
    (EIEC pathotype).
- species: Campylobacter_jejuni
  genes:
  - mapa
  - hipo
  - cadf
  min_hits: 2
  min_identity: 90
  min_coverage: 50
  note: Full-length RefSeq sequences (GCF_000009085.1); any 2 of 3 markers.
    cadF is genus-level; mapA/hipO are species-level. ceuE ortholog exists in
    jejuni — species split relies on the C_coli exclude guard.
- species: Campylobacter_coli
  genes:
  - ceue
  min_hits: 1
  min_identity: 90
  min_coverage: 50
  exclude_genes: [mapa, hipo, cadf]
  note: ceuE from C.coli reference (GCF_009730395.1); jejuni markers present
    -> prefer C_jejuni (exclude guard).
