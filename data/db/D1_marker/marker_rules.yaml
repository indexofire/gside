  min_hits: 1
  min_identity: 90
- species: Escherichia_coli
  genes:
  - uida
  - lacy
  min_hits: 2
  min_identity: 95
  note: Species-level E. coli call from uidA + lacY. DEC/EIEC pathotyping belongs
    to gapit.
- species: Shigella
  genes:
  - uida
  - ipah
  min_hits: 2
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Escherichia_coli
  note: Genus-level call only (uidA+ipaH, lacY-negative). Shigella species/serotype
    discrimination is deliberately not attempted here; use gapit for serotyping.
- species: Campylobacter_jejuni
  genes:
  - mapa
  - hipo
  - cadf
  min_hits: 2
  min_identity: 90
  min_coverage: 50
  note: Full-length RefSeq sequences (GCF_000009085.1); any 2 of 3 markers.
    cadF is genus-level; mapA/hipO are species-level. ceuE ortholog exists in
    jejuni — species split relies on the C_coli exclude guard.
- species: Campylobacter_coli
  genes:
  - ceue
  min_hits: 1
  min_identity: 90
  min_coverage: 50
  exclude_genes: [mapa, hipo, cadf]
  note: ceuE from C.coli reference (GCF_009730395.1); jejuni markers present
    -> prefer C_jejuni (exclude guard).
