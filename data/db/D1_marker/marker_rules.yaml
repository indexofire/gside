  - lacy
  min_hits: 2
  min_identity: 95
  note: Species-level E. coli call from uidA + lacY. DEC/EIEC pathotyping belongs
    to gapit.
- species: Shigella_flexneri
  genes:
  - uida
  - ipah
  - rfc
  - rfbe
  - rfbi
  min_hits: 3
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Ojha 2013 pentaplex target rfc (chromosomal). The genus signature
    (uidA+ipaH) plus lacY-negative keeps EIEC out.
- species: Shigella_sonnei
  genes:
  - uida
  - ipah
  - wbgz
  - sonnei_psuk
  min_hits: 3
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Ojha 2013 target wbgZ is plasmid-borne; plasmid-less strains fall back
    to the Shigella genus rule.
- species: Shigella_dysenteriae
  genes:
  - uida
  - ipah
  - rfpb
  - sd10_wzx
  - sd10_wzy
  - sd12_wzx
  - sd12_wzy
  - sd13_wzx
  - sd13_wzy
  - sd14_wzx
  - sd14_wzy
  - sd15_wzx
  - sd15_wzy
  - sd1_rfp
  - sd1_wzx
  - sd1_wzy
  - sd2_wzx
  - sd2_wzy
  - sd3_wzx
  - sd3_wzy
  - sd4_wzx
  - sd4_wzy
  - sd6_wzx
  - sd6_wzy
  - sd8_wzx
  - sd8_wzy
  - sd9_wzx
  - sd9_wzy
  - sdprove_wzx
  - sdprove_wzy
  - sdprov_wzx
  - sdprov_wzy
  min_hits: 3
  min_identity: 85
  min_coverage: 50
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Genus signature (uidA+ipaH, lacY-negative) plus any one of the 29 ShigaTyper serotype determinants for this species. Coverage is limited by serotype diversity/plasmid loss; otherwise the call falls back to the Shigella genus.
