  min_hits: 1
  min_identity: 90
- species: Mycoplasma_pneumoniae
  genes:
  - p1
  min_hits: 1
  min_identity: 90
- species: Helicobacter_pylori
  genes:
  - urea
  - urec
  min_hits: 1
  min_identity: 90
- species: Bordetella_pertussis
  genes:
  - ptxs1
  - tcfa
  min_hits: 2
  min_identity: 90
  note: IS481 was removed (present in B. holmesii); ptxS1 alone cross-reacts with
    B. bronchiseptica/B. parapertussis. tcfA is only 56% covered in those
    neighbours, so requiring both genes is species-specific.
- species: Corynebacterium_diphtheriae
