  min_coverage: 50
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Genus signature (uidA+ipaH, lacY-negative) plus any one of the 35 ShigaTyper serotype determinants for this species. Coverage is limited by serotype diversity/plasmid loss; otherwise the call falls back to the Shigella genus.
- species: Shigella
  genes:
  - uida
  - ipah
  min_hits: 2
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Escherichia_coli
  note: Shigella = uidA+ / ipaH+ / lacY-negative (Lobersli 2016). EIEC is
    lacY-positive and is called Escherichia_coli; Shigella serotyping/pathotyping
    belongs to gapit. S. boydii/dysenteriae strains lacking ipaH fall through to
    the species-level layers.
- species: Campylobacter_jejuni
  genes:
  - mapa
  - hipo
  - cadf
  min_hits: 2
  min_identity: 90
  min_coverage: 50
  note: Full-length RefSeq sequences (GCF_000009085.1); any 2 of 3 markers.
    cadF is genus-level; mapA/hipO are species-level. ceuE ortholog exists in
    jejuni — species split relies on the C_coli exclude guard.
- species: Campylobacter_coli
  genes:
  - ceue
  min_hits: 1
  min_identity: 90
  min_coverage: 50
  exclude_genes: [mapa, hipo, cadf]
  note: ceuE from C.coli reference (GCF_009730395.1); jejuni markers present
    -> prefer C_jejuni (exclude guard).
