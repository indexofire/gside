rules:
- species: Salmonella_bongori
  genes:
  - inva
  - asst
  - zadh
  require:
  - inva
  min_hits: 2
  min_identity: 90
  priority_over:
  - Salmonella
  - Salmonella_enterica
  note: Bongori species call = genus signal (inva, required) plus at least one
    bongori-specific marker (asst = aryl-sulfate sulfotransferase, zadh =
    zinc-dependent alcohol dehydrogenase; both from S. bongori NCTC 12419,
    absent from all S. enterica subspecies and outgroups; screened against 26
    Salmonella + 5 outgroup genomes, Fookes 2011 PLoS Pathog e1002191).
    A bongori draft missing both markers falls back to the genus rule
    (SPI-2 markers are never present in bongori).
- species: Salmonella_enterica
  genes:
  - inva
  - ssav
  - ssec
  require:
  - inva
  min_hits: 2
  min_identity: 90
  exclude_genes:
  - asst
  - zadh
  priority_over:
  - Salmonella
  note: Species call = genus signal (inva, required) plus at least one SPI-2
    marker (ssav/ssec apparatus genes; SPI-2 is absent from every S. bongori
    strain and outgroup screened, core in all 11 S. enterica panel genomes
    covering 6 subspecies). Divergent enterica lineages stay species-called
    (genus-level identity threshold); bongori markers detected at the global
    floor (85/60) also suppress this rule. SPI-2-negative enterica (rare,
    historic subsp. arizonae isolates) falls back to the genus rule.
    Serovar/subspecies typing belongs to gspec.
- species: Salmonella
  genes:
  - inva
  min_hits: 1
  min_identity: 90
  note: Genus-level fallback for invA-positive genomes where both species
    rules are suppressed (bongori markers detected below the species-rule
    identity floor, 85-90 band); typhoidal/non-typhoidal serovars all
    resolve to Salmonella_enterica above.
- species: Vibrio_parahaemolyticus
  genes:
  - tlh
  min_hits: 1
  min_identity: 90
- species: Haemophilus_parainfluenzae
  genes:
  - ribf-hpi
  - sera-hpi
  require:
  - ribf-hpi
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = ribf-hpi (GTP cyclohydrolase II RibF, 648bp) - 98.6%
    in the confirmed H. parainfluenzae strain (mash-verified), max 83.4%
    in H. influenzae/haemolyticus/pittmaniae (6.6pt specificity margin).
    sera-hpi (phosphoglycerate dehydrogenase) provides a second
    chromosomal marker. H. parainfluenzae is commonly misidentified as
    H. influenzae in clinical labs; this rule enables correct species
    assignment for those strains (they previously reported Unknown
    because hpd is H. influenzae-specific).
- species: Listeria_monocytogenes
  genes:
  - hly
  min_hits: 1
  min_identity: 90
- species: Vibrio_cholerae
  genes:
  - ompw
  min_hits: 1
  min_identity: 85
  note: >-
    ompW species marker lowered to 85% identity: non-O1/non-O139
    environmental strains carry divergent ompW alleles at 86-90% identity
    (the X51948.1 marker derives from an O1 strain at ~99%). Nearest
    non-cholerae relative V. mimicus tops at 80.8%, leaving a 4.2pt
    specificity margin above the threshold.
- species: Vibrio_vulnificus
  genes:
  - vvha
  min_hits: 1
  min_identity: 90
- species: Staphylococcus_aureus
  genes:
  - nuc
  min_hits: 1
  min_identity: 90
- species: Klebsiella_pneumoniae
  genes:
  - khe
  min_hits: 1
  min_identity: 90
- species: Acinetobacter_baumannii
  genes:
  - oxa51
  min_hits: 1
  min_identity: 90
- species: Pseudomonas_aeruginosa
  genes:
  - ecfx
  min_hits: 1
  min_identity: 90
- species: Enterococcus_faecalis
  genes:
  - ddl-ef
  min_hits: 1
  min_identity: 90
- species: Enterococcus_faecium
  genes:
  - ddl-efm
  min_hits: 1
  min_identity: 90
- species: Streptococcus_pneumoniae
  genes:
  - lyta5
  - lyta3
  min_hits: 1
  min_identity: 90
  note: >-
    lytA (the gold-standard pneumococcal marker) split into 5'/3' halves
    (478/479bp): S. pneumoniae's high recombination rate creates assembly
    breakpoints inside the 957bp gene (6/100 real-world draft genomes had
    lytA fragmented across contigs at 4-59% single-HSP coverage, all at
    100% identity). Each half survives on a single contig; min_hits 1
    fires when either half is intact. The original 300bp entry
    (PP971805.1) was a corrupted sequence at 81% identity to the real
    gene - replaced with the TIGR4 CDS.
- species: Streptococcus_pyogenes
  genes:
  - speb
  min_hits: 1
  min_identity: 90
- species: Streptococcus_agalactiae
  genes:
  - cfb
  min_hits: 1
  min_identity: 90
- species: Neisseria_meningitidis
  genes:
  - sodc
  - ctra
  require:
  - sodc
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = sodC (periplasmic Cu/Zn superoxide dismutase, ~436bp)
    - present in all N. meningitidis including capsule-null carriage and
    lab strains, absent from N. gonorrhoeae (the classic species
    discriminator, Corless et al. 2001). ctrA (capsule transport) rides
    along reporting encapsulation status: capsule-null strains (natural
    carriage isolates, lab-adapted) and capsule-switched variants remain
    N. meningitidis without ctrA. Reference validation - MC58
    (capsulated): sodC 99.8%/ctra 97.6% at full length; PartJ
    (capsule-null): sodC 99.8% present, ctra absent.
- species: Neisseria_gonorrhoeae
  genes:
  - pora
  - porb1b
  min_hits: 1
  min_identity: 90
  note: >-
    N. gonorrhoeae porB has two antigenically divergent allele families
    (~78% inter-family identity): porB1a/Por.IA and porB1b/Por.IB. The
    original marker (M21289.1, named pora but actually porB1a) only
    detected the porB1a family - 19/100 real-world genomes carrying
    porB1b were Unknown. porb1b (from FA19, 984bp) covers the second
    family; either allele firing is sufficient (min_hits 1). Nearest
    cross-reaction: N. meningitidis porB tops at 87.8% vs porB1b,
    below the 90% threshold.
- species: Clostridioides_difficile
  genes:
  - muri-cdf
  - isph-cdf
  - tcda
  - tcdb
  require:
  - muri-cdf
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = muri-cdf (glutamate racemase MurI, 807bp) - 100/100
    diverse real-world strains (including 15 non-toxigenic PaLoc-negative
    isolates) at 96.8-100%, zero homology in C. mangenotii/perfringens/
    tetani. isph-cdf (IspH, 840bp) provides a second chromosomal marker.
    tcdA/tcdB (PaLoc pathogenicity locus toxins) report toxigenicity:
    15% of real-world strains are non-toxigenic (PaLoc-negative) and the
    original toxin-only rule made them all Unknown. Non-toxigenic
    C. difficile remains clinically relevant (colonization vs infection
    distinction, infection control).
- species: Cronobacter_sakazakii
  genes:
  - rpob-cs
  min_hits: 1
  min_identity: 95
  exclude_genes: [speb]
  note: rpoB fragment cross-reacts with S.pyogenes/dysgalactiae rpoB
    (cross-reaction case study); speB present -> prefer Streptococcus.
- species: Legionella_pneumophila
  genes:
  - mip
  min_hits: 1
  min_identity: 90
- species: Mycoplasma_pneumoniae
  genes:
  - tuf-mp
  - gyrb-mp
  - p1a
  - p1c
  require:
  - tuf-mp
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = tuf-mp (elongation factor Tu, 1185bp, 100% conserved
    across 30 diverse real-world strains, zero homology in M. genitalium
    and M. hominis). gyrb-mp provides a second chromosomal anchor. P1
    adhesin (4884bp) is kept as two ~1221bp segments (p1a/p1c) for
    cytadherence reporting - the original single full-length P1 marker
    required the entire gene on one contig and missed 29/100 draft
    assemblies to fragmentation. P1 is a virulence gene under immune
    selection and should not anchor the species call.
- species: Helicobacter_pylori
  genes:
  - urea
  - urec
  min_hits: 1
  min_identity: 90
- species: Bordetella_pertussis
  genes:
  - cupin-bp
  - ptxs1
  - tcfa5
  - tcfa3
  require:
  - cupin-bp
  min_hits: 2
  min_identity: 90
  note: >-
    Species anchor = cupin-bp (681bp chromosomal cupin-domain protein, 100%
    conserved across 20 diverse B. pertussis incl. ptxP3 era, max 71% in the
    12-strain near-relative panel - ptxS1 alone cross-reacts at 96-99% with
    B. parapertussis/B. holmesii/B. bronchiseptica and IS481 was removed for
    the same reason, so neither can anchor). tcfA is split into 5'/3' half
    markers because IS-mediated assembly fragmentation (700+ contig drafts,
    30% of RefSeq drafts) breaks the 1944bp full gene across contigs; each
    half survives on a single contig. ptxS1/tcfa halves report virulence
    locus presence; virulence is chromosomal and Bvg-phase variants remain
    detectable.
- species: Corynebacterium_diphtheriae
  genes:
  - rela-cd
  - mena-cd
  - tox
  require:
  - rela-cd
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = rela-cd (GTP pyrophosphokinase, 1020bp) - 30/30 diverse
    strains at 98.3-100%, near relatives (C. ulcerans/pseudotuberculosis/
    striatum/glutamicum) max 70.5%. mena-cd (MenC, 963bp) provides a second
    chromosomal marker. tox (diphtheria toxin, 1683bp) is carried on the
    beta-corynephage and reports toxigenicity: 37/100 real-world genomes
    are non-toxigenic (phage absent) and the original tox-only rule made
    them all Unknown. Non-toxigenic C. diphtheriae remains clinically
    important (invasive disease reports since 1990s).
- species: Haemophilus_influenzae
  genes:
  - hpd
  min_hits: 1
  min_identity: 90
- species: Streptococcus_suis
  genes:
  - gdh
  min_hits: 1
  min_identity: 90
- species: Burkholderia_pseudomallei
  genes:
  - glgb-bp
  - bima-bp
  - sctn-bp
  require:
  - glgb-bp
  min_hits: 1
  min_identity: 95
  note: >-
    Species anchor = glgb-bp (GlgB 1,4-alpha-glucan branching enzyme, 2217bp;
    99.6-100% identity and 100% coverage across 100 clinical B. pseudomallei
    genomes; nearest cross B. thailandensis 73.3%, B. cepacia 82.5%). The
    anchor alone gates the species call. bima-bp (BimA(Bp) actin-nucleating
    factor) and sctn-bp (T3SS ATPase SctN) are virulence reporters: BimA is
    present in 95/100 panel genomes, SctN in 99/100 (one TTS-cluster
    deletion); neither can create or block the call. B. mallei is a clone of
    B. pseudomallei (ANI 99.5%) and cannot be separated at the marker layer;
    the cpin database's BimA(Bm) rule uses priority_over when that allele is
    present. GTDB rs226 labels the clade s__Burkholderia mallei, while
    NCBI/clinical convention (and this rule) reports B. pseudomallei.
- species: Leptospira
  genes:
  - lipl32
  min_hits: 1
  min_identity: 90
  note: >-
    Pathogenic Leptospira group rule. lipl32 (248bp) covers the pathogenic
    species tested: L. interrogans 100/100, L. borgpetersenii 41/41,
    L. kirschneri 37/37, L. noguchii 32/32 at 92-95%; saprophytic
    L. biflexa is 0/8. Species-level typing (interrogans/borgpetersenii/
    kirschneri/noguchii/weilii) needs secY/rpoB MLST and is not attempted
    here; the rule reports the pathogenic genus.
- species: Treponema_pallidum
  genes:
  - tpp47
  min_hits: 1
  min_identity: 90
- species: Bacillus_anthracis
  genes:
  - adk
  - ba5345
  - paga
  - capb
  require:
  - adk
  - ba5345
  min_hits: 2
  min_identity: 90
  priority_over:
  - Bacillus_cereus_group
  note: >-
    Species call = cereus-group anchor (adk) AND the lambdaBa03 chromosomal
    marker (ba5345, ring-trial validated). paga (pXO1) / capb (pXO2) ride
    along as virulence-plasmid reporting, never gating the species call,
    so plasmid-cured/vaccine strains (Sterne) stay Bacillus_anthracis and
    Bcbva/cross-over cereus carrying pXO-like plasmids never fire it.
    Empirical basis, 404-genome panel - adk 150/150 anthracis and 0/8
    outgroup; ba5345 0/246 non-anthracis cereus group (Wielinga 2013 ring
    trial; Bentahir 2018 RPA validation).
- species: Bacillus_cereus_group
  genes:
  - adk
  min_hits: 1
  min_identity: 90
  note: Cereus-group fallback (B. cereus/B. thuringiensis/B. mycoides/etc. and
    lambdaBa03-negative B. anthracis drafts - the prophage assembles poorly
    from short reads, 27% of RefSeq drafts lack it). Anthrax-like profile
    (paga/capb present without ba5345) indicates Bcbva or a cross-over
    strain; see the note emitted with the result.
- species: Yersinia_pestis
  genes:
  - spi-yp
  - btub-yp
  - caf1
  - pla
  require:
  - spi-yp
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = spi-yp (chromosomal sugar phosphate isomerase; 100%
    conserved across 50 diverse real-world strains spanning all three
    biovars, zero homology in Y. pseudotuberculosis/frederiksenii/
    intermedia/kristensenii and E. coli). btub-yp (BtuB) is a second
    chromosomal marker with literature precedent. caf1 (pMT1) and pla
    (pPCP1) are plasmid virulence genes that report toxigenicity - 13% of
    real-world strains have lost pPCP1 (pla-negative), and the original
    min_hits:2 design made those Unknown. Virulence is now reported, never
    gating the species call.
- species: Yersinia_enterocolitica
  genes:
  - glk-ye
  - yddg-ye
  - ail
  - yada
  require:
  - glk-ye
  min_hits: 1
  min_identity: 90
  note: >-
    Species anchor = glk-ye (glycerate kinase; 50-strain real-world panel
    100% present at >=96%, zero homology in Y. pseudotuberculosis/
    frederiksenii/intermedia/kristensenii/pestis and E. coli). The original
    ail/yada entries were corrupted sequences that matched no genome - the
    rule never fired. Replaced with the real CDS: ail (chromosomal,
    PATHOGENIC bioserotypes only - absent from non-pathogenic biotype 1A)
    and yada (pYV virulence plasmid, easily cured) now report pathogenicity
    without gating the species call, so biotype 1A and pYV-cured strains
    stay Yersinia_enterocolitica.
- species: Clostridium_botulinum
  genes:
  - bonta
  - bontb
  - bonte
  - bontc
  - bontd
  - bontf
  min_hits: 1
  min_identity: 80
  note: >-
    C. botulinum is a toxotype, not a genomic species - four genomic groups
    (I-IV) unified only by BoNT production. BoNT serotypes (A-G) share
    only 30-40% inter-type identity, so each type needs its own marker.
    bontA replaced with the real 3891bp CDS (the original 354bp entry was
    corrupted - zero homology to the ATCC 3502 type A reference).
    min_identity lowered to 80 to accommodate intra-serotype subtype
    divergence (A1-A5 subtypes can differ by 10-15%). bontB/bontE retained
    for serotype coverage; bontC/D/F/G markers and chromosomal group
    anchors are future work. Non-toxigenic Clostridium (C. sporogenes
    etc.) correctly reports Unknown.
- species: Clostridium_perfringens
  genes:
  - cpa
  min_hits: 1
  min_identity: 90
- species: Escherichia_coli
  genes:
  - uida
  - lacy
  min_hits: 2
  min_identity: 95
  note: Species-level E. coli call from uidA + lacY. DEC/EIEC pathotyping belongs
    to gspec.
- species: Shigella_flexneri
  genes:
  - uida
  - ipah
  - rfc
  - rfbe
  - rfbi
  require:
  - uida
  - ipah
  min_hits: 3
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Ojha 2013 pentaplex target rfc (chromosomal). The genus signature
    (uidA+ipaH) plus lacY-negative keeps EIEC out.
- species: Shigella_sonnei
  genes:
  - uida
  - ipah
  - wbgz
  - sonnei_psuk
  require:
  - uida
  - ipah
  min_hits: 3
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Ojha 2013 target wbgZ is plasmid-borne; plasmid-less strains fall back
    to the Shigella genus rule.
- species: Shigella_dysenteriae
  genes:
  - uida
  - ipah
  - rfpb
  - sd10_wzx
  - sd10_wzy
  - sd12_wzx
  - sd12_wzy
  - sd13_wzx
  - sd13_wzy
  - sd14_wzx
  - sd14_wzy
  - sd15_wzx
  - sd15_wzy
  - sd1_rfp
  - sd1_wzx
  - sd1_wzy
  - sd2_wzx
  - sd2_wzy
  - sd3_wzx
  - sd3_wzy
  - sd4_wzx
  - sd4_wzy
  - sd6_wzx
  - sd6_wzy
  - sd8_wzx
  - sd8_wzy
  - sd9_wzx
  - sd9_wzy
  - sdprove_wzx
  - sdprove_wzy
  - sdprov_wzx
  - sdprov_wzy
  require:
  - uida
  - ipah
  min_hits: 3
  min_identity: 85
  min_coverage: 50
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Genus signature (uidA+ipaH, lacY-negative) plus any one of the 29 ShigaTyper serotype determinants for this species. Coverage is limited by serotype diversity/plasmid loss; otherwise the call falls back to the Shigella genus.
- species: Shigella_boydii
  genes:
  - uida
  - ipah
  - sb11_wzx
  - sb11_wzy
  - sb12_wzx
  - sb12_wzy
  - sb14_wzx
  - sb14_wzy
  - sb15_wzx
  - sb15_wzy
  - sb16_wzy
  - sb17_wzx
  - sb17_wzy
  - sb18_wzx
  - sb18_wzy
  - sb19_wzx
  - sb19_wzy
  - sb1_wzx
  - sb1_wzy
  - sb2_wzx
  - sb2_wzy
  - sb3_wzx
  - sb3_wzy
  - sb4_wzx
  - sb4_wzy
  - sb5_wzx
  - sb5_wzy
  - sb6_wzx
  - sb6_wzy
  - sb7_wzx
  - sb7_wzy
  - sb8_wzx
  - sb8_wzy
  - sb9_wzx
  - sb9_wzy
  - sbprov_wzx
  - sbprov_wzy
  require:
  - uida
  - ipah
  min_hits: 3
  min_identity: 85
  min_coverage: 50
  exclude_genes:
  - lacy
  priority_over:
  - Shigella
  - Escherichia_coli
  note: Genus signature (uidA+ipaH, lacY-negative) plus any one of the 35 ShigaTyper serotype determinants for this species. Coverage is limited by serotype diversity/plasmid loss; otherwise the call falls back to the Shigella genus.
- species: Shigella
  genes:
  - uida
  - ipah
  min_hits: 2
  min_identity: 95
  exclude_genes:
  - lacy
  priority_over:
  - Escherichia_coli
  note: Shigella = uidA+ / ipaH+ / lacY-negative (Lobersli 2016). EIEC is
    lacY-positive and is called Escherichia_coli; Shigella serotyping/pathotyping
    belongs to gspec. S. boydii/dysenteriae strains lacking ipaH fall through to
    the species-level layers.
- species: Campylobacter_jejuni
  genes:
  - mapa
  - hipo
  - cadf
  min_hits: 2
  min_identity: 90
  min_coverage: 50
  note: Full-length RefSeq sequences (GCF_000009085.1); any 2 of 3 markers.
    cadF is genus-level; mapA/hipO are species-level. ceuE ortholog exists in
    jejuni — species split relies on the C_coli exclude guard.
- species: Campylobacter_coli
  genes:
  - ceue
  min_hits: 1
  min_identity: 85
  min_coverage: 50
  exclude_genes: [hipo, cadf]
  note: >-
    ceuE (enterochelera esterase, 990bp) threshold lowered to 85% to cover
    divergent alleles (86.5% in one strain, 100% coverage). mapa removed
    from exclude_genes: it cross-reacts with some C. coli strains at
    86-98% identity (mapA is not species-specific between C. jejuni and
    C. coli). hipO (absent from all C. coli tested) and cadF (82% in
    C. coli, below the 85% global detection floor) provide the exclusion
    guard instead. C. jejuni reference: ceuE 87%, hipo 100% -> excluded.
- species: Mycobacterium_tuberculosis
  genes: [is6110, is1081]
  min_hits: 1
  min_identity: 96
  note: >-
    MTB-complex insertion sequences: IS6110 (longest H37Rv copy) plus a 300bp
    IS1081 transposase fragment. Against 100 random MTBC genomes (96
    M. tuberculosis + 4 M. canetti), IS6110 calls 95/100 and IS1081 96/100;
    the union is 96/100. The misses are IS-element-poor/fragmented M. canetti
    and two low-copy M. tuberculosis drafts. The 43-genome non-TB
    Mycobacterium panel is correctly negative except M. orygis (an MTBC
    member). Serotyping/DR typing belongs to gspec-lineage tools.
- species: Citrobacter
  genes: [gyrb-cf, leus-citrobacter, cdsa-citrobacter]
  min_hits: 1
  min_identity: 91
  note: >-
    Three housekeeping barcodes. gyrB alone calls 90/100 random Citrobacter
    genomes; leuS (leucine--tRNA ligase, 2583bp; G4551_RS07165) lifts the
    union to 94/100; cdsA (phosphatidate cytidylyltransferase, 858bp;
    U4W25_RS05535) covers the divergent C. amalonaticus (5) and C. farmeri
    (1) clade at 95-100%, taking the union to 100/100. Negative controls:
    leuS/cdsA stay at 68-86% in 400 E. coli/Salmonella/Klebsiella/
    Cronobacter genomes plus Enterobacter (17), Serratia (10), Proteus (18)
    and Yersinia (100); rpoB was rejected because of 97% identity to E. coli.
- species: Chlamydia_pneumoniae
  genes: [ompa-cp, ompa-cpn2]
  min_hits: 1
  min_identity: 94
  min_coverage: 55
  note: MOMP/ompA (Z31593.1 allele + J138 fresh extract); the species is
    exceptionally uniform.
