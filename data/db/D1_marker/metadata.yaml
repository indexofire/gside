schema: gside.marker-db/1
name: species_markers_v2
description: Bundled species marker database. Control genes are conserved single-copy
  genes used only for reads-mode relative-depth gating; they are not species rules.
  Species without a dedicated control fall back to the sample median depth of detected
  markers.
control_genes:
  Salmonella_enterica:
  - rpoD
  Listeria_monocytogenes:
  - prs
  Staphylococcus_aureus:
  - fema
  Klebsiella_pneumoniae:
  - gyrb-kpn
  Acinetobacter_baumannii:
  - rpob-aba
  Pseudomonas_aeruginosa:
  - gyrb-pae
  Streptococcus_pneumoniae:
  - psaa
  Neisseria_meningitidis:
  - sodc
  Campylobacter_jejuni:
