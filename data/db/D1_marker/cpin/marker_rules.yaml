rules:
# ---- CPIN extension (data/CPIN.txt coverage) ----
# Bacterial targets extracted from verified RefSeq reference genomes by
# locus_tag (build notes in this block); rule thresholds come from measured
# cross-BLAST identities against every existing marker and genome.
- species: Brucella
  genes: [bp26, omp25]
  min_hits: 2
  min_identity: 93
  note: Genus rule from B. abortus 2308 (BP26/OMP28 + Omp25; DK47_RS01655/RS05110).
    Classical genus targets; human-pathogenic species share >95% identity here.
- species: Borrelia_burgdorferi
  genes: [flab, ospa]
  min_hits: 2
  min_identity: 93
  note: B. burgdorferi sensu lato (B31 reference; flagellin FlaB + OspA).
    OspA varies across genospecies; 93 keeps the broad sensu-lato call.
- species: Yersinia_pseudotuberculosis
  genes: [inv-yptb, virf]
  min_hits: 2
  min_identity: 94
  exclude_genes: [pla]
  note: IP 32953 invasin + VirF. Y. pestis carries near-identical homologs,
    so the pestis-specific plasmid pPCP1 marker pla suppresses this call
    (caf1 and yada are shared with pseudotuberculosis and cannot exclude).
- species: Bartonella
  genes: [glta-bartonella, rpob-bh]
  min_hits: 2
  min_identity: 85
  note: >-
    Genus rule (B. henselae citrate synthase + rpoB) - the standard
    bartonella genotyping pair. At 92% only 6/97 random Bartonella genomes
    called (B. quintana/bacilliformis/elizabethae cross at 85-92%); the
    genus floor is 85% with both genes (92/97 = 95%). No hits in Brucella/
    Ochrobactrum, Citrobacter, Nocardia, Rickettsiaceae or Anaplasmataceae
    at 85% (100-genome panels).
- species: Rickettsiaceae
  genes: [glta-rickettsia, ompb, 16s-rickettsiaceae]
  min_hits: 1
  min_identity: 90
  min_coverage: 55
  note: >-
    Family rule. The old gltA+OmpB pair (min_hits 2) called only 48/100
    random family genomes: OmpB is absent from the typhus group and most
    non-Rickettsia genera. A 1427bp R. rickettsii 16S rRNA barcode
    (PV716478.1) calls 79/100 family genomes at 90% and has zero hits in
    Anaplasmataceae, Brucella, Bartonella, Citrobacter and Nocardia panels;
    gltA/OmpB remain as confirmatory reporters. Orientia and divergent
    endosymbionts may stay below the threshold.
- species: Anaplasmataceae
  genes: [groel-anaplasma, 16s-anaplasmataceae]
  min_hits: 1
  min_identity: 85
  note: >-
    Family rule. The A. phagocytophilum GroEL marker alone called only 1/99
    random family genomes (GroEL is genus/species-level, not pan-family).
    A 1435bp E. chaffeensis 16S rRNA barcode (AF147752.2) calls 94/99
    family genomes at 85% with zero hits in Rickettsiaceae, Brucella,
    Bartonella, Citrobacter and Nocardia panels; groEL is retained as a
    specific confirmatory reporter.
- species: Chlamydia_psittaci
  genes: [ompa-cps, ompa-cps2]
  min_hits: 1
  min_identity: 94
  min_coverage: 55
  note: MOMP/ompA (PZ860298.1 allele + 01DC12 fresh extract). ompA diverges
    across serovars (~90-96%); 94 keeps the species call.
- species: Escherichia_albertii
  genes: [gyrb-eal]
  min_hits: 1
  min_identity: 92
  note: Barcode (NCTC-class reference gyrB). rpoB rejected at 97% identity
    to E. coli/Shigella; gyrB separates them at <=91%.
- species: Plesiomonas_shigelloides
  genes: [huga]
  min_hits: 1
  min_identity: 92
  note: hugA hemoglobin receptor (type strain); the canonical shigelloides
    target, no cross >=80% anywhere in the panel.
- species: Vibrio_fluvialis
  genes: [rpob-vf, gyrb-vf]
  min_hits: 2
  min_identity: 92
  note: Dual barcode; V. parahaemolyticus rpoB sits at 87.6%.
- species: Francisella_tularensis
  genes: [tul4, fopa]
  min_hits: 2
  min_identity: 93
  note: TUL4/LpnA + FopA (holarctica LVS). Reports the F. tularensis group;
    F. novicida/F. philomiragia stay below the threshold.
- species: Burkholderia_mallei
  genes: [bima-bm]
  min_hits: 1
  min_identity: 98
  priority_over: [Burkholderia_pseudomallei]
  note: >-
    BimA(Bm) allele (ATCC 23344). The B. mallei allele is not fully private:
    3/100 clinical B. pseudomallei genomes carry a Bm-like allele at
    96.2-96.4% full-length identity. True B. mallei measures 99.6-100%
    (ATCC 23344 and GCF_000959405.1), so the threshold sits at 98 between
    the cross and the allele. priority_over resolves samples whose genomes
    retain both branches.
- species: Burkholderia_gladioli
  genes: [rpob-bg, gyrb-bg]
  min_hits: 2
  min_identity: 92
  note: BSR3 dual barcode; nearest cross (B. pertussis rpoB) sits at 84.9%.
- species: Nocardia
  genes: [hsp65, gyrb-no]
  min_hits: 1
  min_identity: 91
  min_coverage: 55
  note: >-
    Genus rule (N. farcinica hsp65/GroEL paralog NFA_RS26175 + gyrB); hsp65
    is the standard nocardia sequencing barcode. Requiring both genes at
    90% called only 29/98 random Nocardia genomes because gyrB is more
    divergent. With min_hits 1 and a 91% floor, hsp65 alone calls 87/98
    (88.8%); the nearest full-length cross is Mycobacterium at 90.5% and
    Rhodococcus at 89.4%, so 91% is the specificity boundary.
- species: Cryptococcus
  genes: [its-cryptococcus]
  min_hits: 1
  min_identity: 88
  min_coverage: 50
  note: >-
    ITS1-5.8S-ITS2 barcode (C. neoformans H99); genus-level clinical call.
    At 88% it calls 46/53 full-length ITS records (36/53 at 92%); the
    nearest cross, Rhodotorula, stays at 0/90.
- species: Aspergillus
  genes: [its-aspergillus, bena-aspergillus]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: >-
    Dual barcode. ITS1-5.8S-ITS2 alone calls 32/92 full-length ITS records at
    92%; lowering it to 85% would cross Penicillium (85/87). benA
    (beta-tubulin, 506bp; PZ612096.1) adds an independent Aspergillus clade
    signal with 0/199 Penicillium+Talaromyces records at 85-95%, so the
    92% floor stays.
- species: Pneumocystis
  genes: [its-pneumocystis, mtlsu-pneumocystis]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: >-
    ITS is too divergent at genus level (9/59 full-length records at 92%);
    the 255bp mtLSU rRNA barcode (PZ378845.1) calls 42/100 Pneumocystis
    records and is retained alongside ITS. A longer mtLSU/18S barcode is
    preferred for clinical P. jirovecii PCR.
- species: Coccidioides
  genes: [its-coccidioides]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (C. immitis RS); genus-level clinical call.
- species: Histoplasma
  genes: [its-histoplasma]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (H. capsulatum G186AR); genus-level clinical call.
- species: Blastomyces
  genes: [its-blastomyces]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (B. dermatitidis ER-3); genus-level clinical call.
- species: Paracoccidioides
  genes: [its-paracoccidioides]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (P. lutzii Pb01); genus-level clinical call.
- species: Talaromyces_marneffei
  genes: [its-talaromyces]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (T. marneffei ATCC 18224); genus-level clinical call.
- species: Rhinocladiella
  genes: [its-rhinocladiella]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (R. mackenziei CBS 650.93); genus-level clinical call.
- species: Cladophialophora
  genes: [its-cladophialophora]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (C. bantiana CBS 173.52); genus-level clinical call.
- species: Fusarium
  genes: [its-fusarium, tef1-fusarium]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: >-
    Dual barcode. ITS alone calls 25/71 full-length records at 92%; at 85%
    it crosses Trichoderma (47/94). TEF1 (translation elongation factor
    1-alpha, 683bp; QB150418.1) calls 35/92 Fusarium records at 92% with
    0/87 Trichoderma at 85-95%, lifting the union without the ITS cross.
- species: Sporothrix
  genes: [its-sporothrix]
  min_hits: 1
  min_identity: 92
  min_coverage: 50
  note: ITS1-5.8S-ITS2 barcode (S. schenckii 1099-18); genus-level clinical call.
- species: Candida
  genes: [its-candida]
  min_hits: 1
  min_identity: 85
  min_coverage: 50
  note: >-
    ITS1-5.8S-ITS2 barcode (C. albicans SC5314); genus-level clinical call.
    At 85% it calls 29/33 full-length ITS records (17/33 at 92%);
    Saccharomyces and Pichia stay at 0/89. Candida is polyphyletic, so
    confirm unusual yeasts with a second locus.
- species: Aeromonas_hydrophila
  genes:
  - gyrb-ahyd
  - ahh1
  require:
  - gyrb-ahyd
  min_hits: 1
  min_identity: 97
  note: >-
    gyrB is the species anchor (100/100 panel at 97%; nearest A. dhakensis
    max 95.7%). ahh1 is a confirmatory haemolysin reporter; it is shared
    with A. dhakensis (96/100), so the gyrB require guard prevents the
    dhakensis false call. The old aera entry was misassigned (it matches
    A. veronii) and was removed.
- species: Aeromonas_caviae
  genes:
  - gyrb-acav
  min_hits: 1
  min_identity: 96
  note: >-
    gyrB species barcode: 100/100 random A. caviae genomes at 96%; other
    Aeromonas species top out at 94.7%.
- species: Aeromonas_veronii
  genes:
  - rpob-aver
  min_hits: 1
  min_identity: 98
  note: >-
    rpoB species barcode: 48/99 random A. veronii genomes at 98%; the
    nearest species is A. jandaei at 97.3%, so gyrB alone (which overlaps
    jandaei) was rejected for veronii.
- species: Aeromonas_dhakensis
  genes:
  - gyrb-adha
  min_hits: 1
  min_identity: 97
  note: >-
    gyrB species barcode: 95/100 random A. dhakensis genomes at 97%;
    A. hydrophila tops out at 95.8%.
- species: Aeromonas_jandaei
  genes:
  - gyrb-ajan
  min_hits: 1
  min_identity: 97
  note: >-
    gyrB species barcode: 48/96 random A. jandaei genomes at 97%;
    A. veronii gyrB tops at 95.9%, so the 97% floor separates the pair
    (rpoB was rejected because veronii reaches 98.2% on one genome).
- species: Aeromonas_schubertii
  genes:
  - gyrb-asch
  min_hits: 1
  min_identity: 90
  note: >-
    gyrB species barcode: all 16 available A. schubertii genomes at 90%;
    other Aeromonas species top out at 88.9%.
- species: Aeromonas_salmonicida
  genes:
  - gyrb-asal
  min_hits: 1
  min_identity: 93
  note: >-
    gyrB species barcode: 95/95 random A. salmonicida genomes at 93%; other
    Aeromonas species top out at 92.7%.
