schema: gside.marker-db/1
name: cpin_markers
extends: default
description: >-
  CPIN (data/CPIN.txt) coverage extension - 21 bacterial targets from verified
  RefSeq reference genomes plus 13 fungal ITS barcodes. The common enteric/
  respiratory rules Citrobacter, Mycobacterium_tuberculosis and
  Chlamydia_pneumoniae live in the default database; all Aeromonas species
  barcodes live here. "extends: default"
  pools the bundled database in automatically, so "-d cpin" and
  "-d default -d cpin" run identically; single-database isolation is
  available via --marker-db on a copy without the extends key.
control_genes:
  Aeromonas_caviae:
  - gyrb-acav
  Aeromonas_dhakensis:
  - gyrb-adha
  Aeromonas_hydrophila:
  - gyrb-ahyd
  Aeromonas_jandaei:
  - gyrb-ajan
  Aeromonas_salmonicida:
  - gyrb-asal
  Aeromonas_schubertii:
  - gyrb-asch
  Aeromonas_veronii:
  - rpob-aver
  Plesiomonas_shigelloides:
  - rpob-plesiomonas_shigelloides
  Yersinia_pseudotuberculosis:
  - rpob-yersinia_pseudotuberculosis
  Escherichia_albertii:
  - gyrb-eal
  Vibrio_fluvialis:
  - gyrb-vf
  Burkholderia_gladioli:
  - gyrb-bg
  Nocardia:
  - gyrb-no
  Brucella:
  - rpob-brucella
  Borrelia_burgdorferi:
  - rpob-borrelia_burgdorferi
  Burkholderia_mallei:
  - rpob-burkholderia_mallei
  Chlamydia_psittaci:
  - rpob-chlamydia_psittaci
  Bartonella:
  - rpob-bartonella
  Rickettsiaceae:
  - rpob-rickettsiaceae
  Anaplasmataceae:
  - rpob-anaplasmataceae
  Francisella_tularensis:
  - rpob-francisella_tularensis
reads:
  min_depth: 5.0
  min_relative_depth: 0.1
  min_mapq: 20
